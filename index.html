<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Gousto Vault</title>
  <meta name="theme-color" content="#ffffff">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --brand: #e11d48;
      --brand-hover: #be123c;
      --brand-soft: #fff1f2;
      --bg: #f8fafc;
      --surface: #ffffff;
      --border: #e2e8f0;
      --border-focus: #cbd5e1;
      --text: #0f172a;
      --text-muted: #64748b;
      --radius: 16px;

      /* Dietary category hues */
      --cat-chicken-bg: #fff7ed;
      --cat-chicken-txt: #c2410c;
      --cat-chicken-bar: #fb923c;
      --cat-beef-bg: #ffe4e6;
      --cat-beef-txt: #9f1239;
      --cat-beef-bar: #f43f5e;
      --cat-veg-bg: #f0fdf4;
      --cat-veg-txt: #166534;
      --cat-veg-bar: #4ade80;
      --cat-fish-bg: #ecfeff;
      --cat-fish-txt: #0e7490;
      --cat-fish-bar: #38bdf8;

      /* Macro indicators */
      --macro-prot: #2563eb;
      --macro-carb: #d97706;
      --macro-fat: #e11d48;
      --macro-cal: #475569;
      --star-active: #f59e0b;
      --star-inactive: #cbd5e1;
    }

    * { box-sizing: border-box; font-family: 'Plus Jakarta Sans', -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; }
    
    body {
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Top Sticky Header spanning full width */
    header {
      position: sticky;
      top: 0;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 14px 24px;
      z-index: 50;
      width: 100%;
    }
    .header-inner {
      width: 100%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .logo {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      margin: 0;
    }
    .logo span { color: var(--brand); }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      box-shadow: 0 0 0 3px rgba(34, 197, 94, 0.2);
    }

    /* Full-width Responsive Main Container */
    main {
      flex: 1;
      width: 100%;
      padding: 18px 24px 140px 24px;
    }
